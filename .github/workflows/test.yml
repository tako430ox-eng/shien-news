name: テスト
on:
  pull_request:
  push:
    branches-ignore: [main]
# テストは読むだけ。リポジトリの既定の権限に頼らず、書き込みの権限を渡さない
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 家賃編と仕事を失ったときのページのテスト
        run: node --test tests/test_yachin.cjs tests/test_shitsugyo.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests
